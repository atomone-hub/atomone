name: "Release"

on:
  # manually (re-)release an existing tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v4.2.0-rc.1"
        required: true
        type: string

  push:
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+"
      - "v[0-9]+\\.[0-9]+\\.[0-9]+-rc[0-9]+"
      - "v[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # on workflow_dispatch, check out the requested tag
          ref: ${{ inputs.tag || github.ref }}
      - run: git fetch --force --tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set Env
        run: echo "TM_VERSION=$(make print_tm_version)" >> $GITHUB_ENV

      - name: Release
        uses: goreleaser/goreleaser-action@v5
        with:
          version: v1.25.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
